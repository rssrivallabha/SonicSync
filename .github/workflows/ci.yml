name: sonicsync-ci

concurrency:
  group: sonicsync-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: timeout 90s npm run smoke
      - run: npm run public:check
      - run: timeout 120s npm run public:smoke
      - run: npm run sim -- --nodes 32 --duration 60 --latency 80 --jitter 25 --drift 120 --loss 0.03
