name: sonicsync-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: npm run public:check
      - run: npm run public:smoke
      - run: npm run sim -- --nodes 32 --duration 60 --latency 80 --jitter 25 --drift 120 --loss 0.03
